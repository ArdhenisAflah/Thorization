name: Thorization CD - Release & Artifact Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Quality & Run SpotBugs
        run: ./gradlew check spotbugsMain

      - name: Build Release Fat JAR
        run: ./gradlew shadowJar

      - name: Compute Checksum
        run: |
          cd app/build/libs
          sha256sum Thorization.jar > Thorization.jar.sha256
          echo "SHA256 Checksum:"
          cat Thorization.jar.sha256

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Thorization Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/libs/Thorization.jar
            app/build/libs/Thorization.jar.sha256
